<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek Tim KKN Wuryorejo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50 text-emerald-900 font-sans antialiased selection:bg-pink-200">
    <header class="bg-gradient-to-b from-pink-900 via-pink-800 to-emerald-900 text-white py-16 px-4 text-center">
        <div class="max-w-4xl mx-auto space-y-4">
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight">Proyek & Karya Tim</h1>
            <p class="text-emerald-200 text-sm sm:text-base max-w-2xl mx-auto leading-relaxed">
                Kumpulan proyek yang dibuat masing-masing anggota Tim KKN Kelurahan Wuryorejo.
            </p>
            <a href="index.html" class="inline-flex items-center justify-center rounded-full bg-white px-5 py-2.5 text-sm font-semibold text-pink-900 shadow hover:bg-emerald-50 transition">Kembali ke Profil</a>
        </div>
    </header>

    <main class="py-12 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="projects-content" class="space-y-10"></div>
    </main>

    <footer class="bg-emerald-900 text-emerald-100 py-8 text-center text-xs mt-16 border-t border-emerald-800">
        <p>&copy; 2026 Tim KKN Kelurahan Wuryorejo. All rights reserved.</p>
    </footer>

    <script>

                foto: "./awallin.png",
                proyek: [
                    { judul: "Pengembangan Sistem Informasi", deskripsi: "Membangun sistem dokumentasi kegiatan dan laporan digital berbasis web." },
                    { judul: "Koordinasi Program Desa", deskripsi: "Memimpin tim pendataan dan sinkronisasi jadwal kegiatan lapangan." }
                ]
            },
            {
                id: 9,
                nama: "Euis Almira Kholifatur Rosyid",
                jabatan: "Sekretaris I",
                nim: "11000123120005",

                proyek: [
                    { judul: "Manajemen Admin", deskripsi: "Mengatur arsip dokumen, pencatatan notulen, dan administrasi surat-menyurat." },
                    { judul: "Publikasi Hukum", deskripsi: "Membantu penyusunan aturan internal dan tata tertib acara lapangan." },
                    { judul: "Legalitas Usaha", deskripsi: "Dokumen legalitas usaha sesuai materi asli.", file: "LEGALITAS USAHA.pdf" }
                ]

                foto: "./natasya.png",
                proyek: [
                    { judul: "Dokumentasi Lapangan", deskripsi: "Mendokumentasikan kegiatan lapangan dan materi edukasi pertanian." }
                ]
            },
            {

                nama: "Rosa Amelia Geraldine",

                    { judul: "Pengelolaan Dana", deskripsi: "Mengatur anggaran program dan mencatat pemasukan serta pengeluaran tim." }
                ]
            },
            {
                id: 4,
                nama: "Mouline Afina Putri Heriyanto",
                jabatan: "Bendahara II",
                nim: "24020223140083",
                jurusan: "Bioteknologi",
                foto: "./mouline.png",
                proyek: [
                    { judul: "Pengadaan Bahan", deskripsi: "Mengelola logistik kebutuhan bahan edukasi dan workshop bioteknologi." }
                ]
            },
            {
                id: 1,
                nama: "Keyzia Lady Syafira",
                jabatan: "Koordinator Humas",

                jurusan: "Antropologi Sosial",
                foto: "./keyzia.png",
                proyek: [
                    { judul: "Komunikasi Publik", deskripsi: "Mengelola hubungan masyarakat dan publikasi informasi kegiatan." }
                ]
            },
            {

                jabatan: "Divisi PDD",
                nim: "13020223120018",

                foto: "./marlinda.png",
                proyek: [

                ]
            },
            {
                id: 2,
                nama: "Harry Rahmat Abrar",

                foto: "./harry.png",
                proyek: [
                    { judul: "Desain Dokumentasi", deskripsi: "Mendesain materi grafis promosi dan dokumentasi acara." }
                ]
            },
            {
                id: 8,
                nama: "Dias Rafi Maulana Nuriswan",
                jabatan: "Divisi Logistik",
                nim: "14040123140224",
                jurusan: "Ilmu Komunikasi",
                foto: "./dias.png",
                proyek: [
                    { judul: "Koordinasi Logistik", deskripsi: "Menjamin kelancaran distribusi alat dan bahan kegiatan tim." }
                ]
            },
            {
                id: 7,
                nama: "Athallah Bintang Akmal",
                jabatan: "Divisi Logistik",
                nim: "40011323650203",
                jurusan: "Manajemen dan Administrasi Logistik",
                foto: "./athallah.png",
                proyek: [
                    { judul: "Operasional Lapangan", deskripsi: "Mendukung kegiatan logistik dan monitoring kebutuhan lapangan." }
                ]
            }
        ];

        const params = new URLSearchParams(window.location.search);
        const memberId = params.has('member') ? Number(params.get('member')) : null;
        const content = document.getElementById('projects-content');

        function createProjectCard(project) {
            return `
                <li class="rounded-2xl bg-emerald-50 p-4 border border-emerald-100">
                    <p class="font-semibold text-emerald-900">${project.judul}</p>
                    <p class="text-xs mt-1 text-emerald-700">${project.deskripsi}</p>
                </li>
            `;
        }

        function renderMember(member) {
            document.title = `Proyek ${member.nama} - KKN Wuryorejo`;
            const fileProjects = member.proyek.filter(project => project.file);
            
            // Penyesuaian posisi foto khusus Euis
            const customPosition = member.foto.includes('euis.png') ? 'object-position: center top;' : '';

            content.innerHTML = `
                <div class="bg-white rounded-3xl p-8 shadow-sm border border-emerald-100">
                    <div class="text-center mb-8">
                        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-emerald-900">Proyek ${member.nama}</h1>
                        <p class="mt-3 text-emerald-600 text-sm sm:text-base max-w-2xl mx-auto">
                            Detail proyek dan kontribusi individu dalam program KKN Kelurahan Wuryorejo.
                        </p>
                        <div class="mt-6 flex justify-center">
                            <img src="${member.foto}" alt="Foto ${member.nama}" class="w-40 h-40 object-cover rounded-full border-4 border-emerald-100 shadow-lg" style="${customPosition}" onerror="this.onerror=null; this.src='https://via.placeholder.com/160?text=No+Photo';">
                        </div>
                    </div>
                    <div class="grid gap-6 sm:grid-cols-2">
                        <div class="rounded-3xl bg-emerald-50 p-6 border border-emerald-100">
                            <p class="text-sm font-semibold text-emerald-900">Jabatan</p>
                            <p class="text-sm text-emerald-700 mt-2">${member.jabatan}</p>
                        </div>
                        <div class="rounded-3xl bg-emerald-50 p-6 border border-emerald-100">
                            <p class="text-sm font-semibold text-emerald-900">NIM</p>
                            <p class="text-sm text-emerald-700 mt-2">${member.nim}</p>
                        </div>
                        <div class="rounded-3xl bg-emerald-50 p-6 border border-emerald-100 sm:col-span-2">
                            <p class="text-sm font-semibold text-emerald-900">Jurusan</p>
                            <p class="text-sm text-emerald-700 mt-2">${member.jurusan}</p>
                        </div>
                    </div>
                    <div class="mt-8">
                        <h2 class="text-xl font-bold text-emerald-900 mb-4">Karya & Proyek Utama</h2>
                        <ul class="space-y-4">
                            ${member.proyek.map(createProjectCard).join('')}
                        </ul>
                    </div>
                    ${fileProjects.length ? `
                    <div class="mt-8">
                        <h2 class="text-xl font-bold text-emerald-900 mb-4">Materi Legalitas Usaha</h2>
                        <div class="rounded-3xl bg-emerald-50 p-6 border border-emerald-100">
                            <p class="text-sm text-emerald-700 mb-4">Berikut materi dokumen legalitas usaha yang bisa dibaca langsung.</p>
                            <a href="${fileProjects[0].file}" target="_blank" class="inline-flex items-center justify-center rounded-full bg-pink-600 px-4 py-2 text-sm font-semibold text-white hover:bg-pink-700 transition">Buka Materi Legalitas Usaha</a>
                        </div>
                        <div class="mt-6 rounded-3xl overflow-hidden border border-emerald-100 shadow-sm">
                            <iframe src="${fileProjects[0].file}" class="w-full h-[600px]" title="Materi Legalitas Usaha"></iframe>
                        </div>
                    </div>` : ''}
                </div>
            `;
        }

        function renderAllMembers() {
            document.title = 'Proyek Tim KKN Wuryorejo';
            content.innerHTML = `
                <div class="text-center">
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-emerald-900">Proyek Tim KKN Wuryorejo</h1>
                    <p class="mt-3 text-emerald-600 text-sm sm:text-base max-w-2xl mx-auto">
                        Pilih anggota tim dari halaman profil untuk melihat proyek individu mereka.
                    </p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    ${anggotaProyek.map(member => `
                        <article class="bg-white rounded-3xl p-6 shadow-sm border border-emerald-100">
                            <div class="flex items-center space-x-4 mb-4">
                                <img src="${member.foto}" alt="${member.nama}" class="w-16 h-16 object-cover rounded-full border-2 border-emerald-100" style="${member.foto.includes('euis.png') ? 'object-position: center top;' : ''}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=No+Photo';">
                                <div>
                                    <h2 class="text-xl font-bold text-emerald-900">${member.nama}</h2>
                                    <p class="text-sm text-emerald-600">${member.jabatan} • NIM: ${member.nim}</p>
                                </div>
                            </div>
                            <ul class="space-y-3 text-emerald-700 mb-6">
                                ${member.proyek.map(project => `
                                    <li class="rounded-2xl bg-emerald-50 p-4 border border-emerald-100">
                                        <p class="font-semibold text-emerald-900">${project.judul}</p>
                                        <p class="text-xs mt-1">${project.deskripsi}</p>
                                    </li>
                                `).join('')}
                            </ul>
                            <div class="text-right">
                                <a href="projects.html?member=${member.id}" class="inline-flex items-center justify-center rounded-full bg-pink-600 px-4 py-2 text-xs font-semibold text-white hover:bg-pink-700 transition">Lihat Proyek Individu</a>
                            </div>
                        </article>
                    `).join('')}
                </div>
            `;
        }

        const member = memberId ? anggotaProyek.find(item => item.id === memberId) : null;
        if (member) {
            renderMember(member);
        } else {
            renderAllMembers();
        }
    </script>
</body>
</html>
